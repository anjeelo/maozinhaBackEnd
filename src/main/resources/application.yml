spring:

  application:
    name: maozinha

  profiles:
    default: dev

  jackson:
    time-zone: UTC

    deserialization:
      fail-on-unknown-properties: true

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

  mvc:
    problemdetails:
      enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8

    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

server:
  shutdown: graceful

management:

  endpoints:

    web:

      exposure:

        include:
          - health
          - info

  endpoint:

    health:

      show-details: never

springdoc:

  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

logging:
  level:
    org.springframework.web: INFO
    org.springframework.http.converter.json: INFO

security:

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 15m
    refresh-token-expiration: 30d
    issuer: maozinha

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173

    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS

    allowed-headers:
      - Authorization
      - Content-Type
      - Accept

    allow-credentials: true

  rate-limit:
    capacity: 100
    refill-tokens: 100
    refill-period: 1m

maozinha:

  job:
    max-selecionados: 5